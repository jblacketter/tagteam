name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # PyPI trusted publishing
      contents: write      # create the GitHub Release for the tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # Phase 48: contract_hashes.py walks the full history + tags
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches pyproject.toml and CITATION.cff versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} (=${TAG_VERSION}) does not match pyproject.toml version ${PYPROJECT_VERSION}"
            exit 1
          fi
          echo "Tag matches pyproject.toml: ${PYPROJECT_VERSION}"
          # CITATION.cff is bumped by scripts/release.py alongside pyproject.toml;
          # a hand bump that skips the script must not ship a stale citation.
          CFF_VERSION=$(sed -n 's/^version:[[:space:]]*//p' CITATION.cff | head -n1)
          if [ "$TAG_VERSION" != "$CFF_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} (=${TAG_VERSION}) does not match CITATION.cff version ${CFF_VERSION:-<missing>} — run scripts/release.py"
            exit 1
          fi
          echo "Tag matches CITATION.cff: ${CFF_VERSION}"
          # Phase 48: the plugin ships from this repo in lockstep; a tag must
          # not carry a plugin manifest at a different version, or a plugin
          # contract that differs from the packaged one.
          PLUGIN_VERSION=$(python -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} (=${TAG_VERSION}) does not match plugin.json version ${PLUGIN_VERSION} — run scripts/release.py"
            exit 1
          fi
          echo "Tag matches plugin.json: ${PLUGIN_VERSION}"
          cmp plugin/skills/handoff/SKILL.md tagteam/data/.claude/skills/handoff/SKILL.md || { echo "plugin/skills/handoff/SKILL.md differs from the packaged contract"; exit 1; }
          python scripts/contract_hashes.py --check

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Runs only after PyPI succeeds, so a Release never advertises a version
      # that failed to publish. Idempotent: a Release written by hand before the
      # tag was pushed (v3.13.0 was) keeps its body — this never overwrites one.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — leaving its body alone."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
