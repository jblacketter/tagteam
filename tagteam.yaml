# Tagteam Configuration
# Defines the two AI agents and their roles in the collaboration workflow.

agents:
  lead:
    name: claude
  reviewer:
    name: codex

# Escalation briefer: writes a decision brief when a cycle escalates.
briefer:
  enabled: true

# Synchronous implementation gate: the lead's `cycle add` runs the suite +
# scope + plan-doc checks — the round's one full-suite run on the record.
gatekeeper:
  enabled: true
  on_submit: true
  tests:
    command: ".venv/bin/python -m pytest -q -p no:cacheprovider"
    timeout_minutes: 15
