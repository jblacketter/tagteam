# Tagteam Configuration
# Defines the two AI agents and their roles in the collaboration workflow.

agents:
  lead:
    name: codex
  reviewer:
    name: claude

# Escalation briefer and synchronous implementation gate, restored from HEAD.
briefer:
  enabled: true

gatekeeper:
  enabled: true
  on_submit: true
  tests:
    command: ".venv/bin/python -m pytest -q -p no:cacheprovider"
    timeout_minutes: 15
